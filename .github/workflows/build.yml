name: Build Rapido Auto Clicker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Build Rapido Auto Clicker APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Locate and prepare APK
      run: |
        mkdir -p output-apk
        find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output-apk/Rapido-AutoClicker-Free.apk \;
        ls -la output-apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rapido-AutoClicker-Free-APK
        path: output-apk/Rapido-AutoClicker-Free.apk
        retention-days: 30
